<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Notixa - AI Voice Notes, Calendar Meetings & Financial Expense Tracking">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Notixa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Notixa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Real-time Speech-to-Text Web Bridge -->
  <script>
    var globalRecognition = null;

    window.startWebSpeechRecognition = function(callback) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn("Speech Recognition not supported in this browser.");
        return false;
      }
      try {
        if (globalRecognition) {
          globalRecognition.abort();
        }
        globalRecognition = new SpeechRecognition();
        globalRecognition.lang = 'ar-EG';
        globalRecognition.continuous = true;
        globalRecognition.interimResults = true;

        globalRecognition.onresult = function(event) {
          var finalTranscript = '';
          for (var i = 0; i < event.results.length; ++i) {
            finalTranscript += event.results[i][0].transcript;
          }
          if (callback && typeof callback === 'function') {
            callback(finalTranscript);
          }
        };

        globalRecognition.onerror = function(event) {
          console.warn("Speech Recognition Error:", event.error);
        };

        globalRecognition.start();
        return true;
      } catch (e) {
        console.error("Speech Recognition Exception:", e);
        return false;
      }
    };

    window.stopWebSpeechRecognition = function() {
      if (globalRecognition) {
        try {
          globalRecognition.stop();
        } catch (e) {}
        globalRecognition = null;
      }
    };
  </script>
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
