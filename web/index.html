<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Nexa - AI Voice Notes, Calendar Meetings & Financial Expense Tracking">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nexa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nexa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #F8F9FE;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    flutter-view {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <!-- Speech and Audio Web Engine -->
  <script>
    var globalRecognition = null;
    var audioStream = null;

    window.startWebSpeechRecognition = async function(callback) {
      // 1. Explicitly request microphone permission from browser first
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
      } catch (err) {
        console.warn("Microphone permission prompt failed or denied:", err);
      }

      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("متصفحك الحالي لا يدعم التعرف الصوتي المباشر عبر الويب (Web Speech API). يمكنك كتابة الملاحظة وسيقوم الذكاء الاصطناعي بتحليلها فوراً!");
        return false;
      }

      try {
        if (globalRecognition) {
          try { globalRecognition.abort(); } catch(e){}
        }
        globalRecognition = new SpeechRecognition();
        globalRecognition.lang = 'ar-EG';
        globalRecognition.continuous = true;
        globalRecognition.interimResults = true;
        globalRecognition.maxAlternatives = 1;

        globalRecognition.onresult = function(event) {
          var finalTranscript = '';
          for (var i = 0; i < event.results.length; ++i) {
            finalTranscript += event.results[i][0].transcript;
          }
          if (callback && typeof callback === 'function') {
            callback(finalTranscript);
          }
        };

        globalRecognition.onerror = function(event) {
          console.warn("Speech recognition error:", event.error);
          if (event.error === 'not-allowed') {
            alert("يرجى السماح بصلاحية الميكروفون في المتصفح لتسجيل الصوت.");
          } else if (event.error === 'service-not-allowed') {
            alert("متصفح Brave يحجب خدمة التعرف الصوتي السحابية لجوجل افتراضياً. يمكنك كتابة النص مباشرة في المربع أدناه لتحليله.");
          }
        };

        globalRecognition.start();
        return true;
      } catch (e) {
        console.error("Speech Exception:", e);
        return false;
      }
    };

    window.stopWebSpeechRecognition = function() {
      if (globalRecognition) {
        try { globalRecognition.stop(); } catch(e){}
        globalRecognition = null;
      }
      if (audioStream) {
        try {
          audioStream.getTracks().forEach(track => track.stop());
        } catch(e){}
        audioStream = null;
      }
    };
  </script>
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
