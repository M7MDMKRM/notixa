name: notixa
description: "Notixa - AI Voice Notes, Calendar Meetings & Financial Expense Tracking Application"
publish_to: "none"
version: 1.0.6+11

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  get_it: ^7.6.0
  provider: ^6.1.1
  go_router: ^13.0.0

  # Networking & HTTP
  dio: ^5.4.0
  http: ^1.2.0

  # Local Persistence & Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # UI, Icons, Fonts & Animations
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  table_calendar: ^3.0.9
  currency_picker: ^2.0.19
  intl: any
  uuid: ^4.3.3

  # Audio & Speech
  record: ^5.0.4
  web_socket_channel: ^2.4.1

  # Alarms & Notifications
  flutter_local_notifications: ^17.0.0
  android_alarm_manager_plus: ^3.0.4
  flutter_ringtone_player: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/Logo.png
    - assets/app_icon.png
    - assets/auth/
    - assets/SVGs/
